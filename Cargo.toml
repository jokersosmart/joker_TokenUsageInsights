[package]
name = "joker-token-usage-insights"
version = "0.1.5"
edition = "2021"
default-run = "joker-token-usage-insights"
description = "joker_TokenUsageInsights: local-first AI CLI token usage dashboard (derived from doggy8088/TokenUsageInsights)"
license = "MIT"
repository = "https://github.com/jokersosmart/joker_TokenUsageInsights"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
dirs = "5.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
